name: CI

# CI runs at major steps, not on every push, to keep Actions minutes down
# (private-repo minutes are metered and Windows bills at twice the Linux rate).
#
#   - Every push to a PR, draft or not: the fast checks only (privacy gate and
#     lint, Ubuntu, about a minute of runner time each).
#   - The full matrix (tests, type check, installability on Linux + Windows):
#     when a PR is marked ready for review, on every push to a PR that is
#     already ready, before a release (release.yml calls this workflow on the
#     tag push), on the public mirror (free runners), and on demand (Actions
#     tab, "Run workflow", pick the branch).
#   - Pushes to master (each merge): the fast checks only. A PR is merged only
#     after master is merged into it and its full run is green, so that run
#     already tested the tree master gets; running the matrix again on the
#     same tree doubled the cost of every merge. To test master itself, use
#     "Run workflow".
#   - A newer push to the same PR cancels the run it supersedes.
#   - macOS: one job, run only on the public mirror (free runners there).
#   - release.yml calls this workflow, so a tag builds only after it passes.
#
# So keep a PR in draft while iterating, and mark it ready (or run the
# workflow by hand) when it is worth testing in full.
on:
  push:
    branches: [master, main]
  pull_request:
    # ready_for_review is not in the default set; it is what starts the full
    # matrix when a draft is promoted.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # release.yml calls this whole workflow before it builds a tag, so nothing
  # reaches PyPI from a commit the suite has not passed on.
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs are cancelled: every master commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, Linux-only, every push. Kept in its own job so a draft PR still gets
  # lint feedback without paying for the matrix.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pin ruff so CI and local (the dev extra) flag the same things: an
      # unpinned ruff bump silently broke Lint once.
      - name: Install ruff
        run: python -m pip install "ruff==0.15.19"

      - name: Lint
        run: ruff check .

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    # Full matrix only at major steps; see the header.
    if: >-
      github.repository == 'ChironTheCentaur/openflo-public' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/'))
    runs-on: ${{ matrix.os }}
    # A full run takes about 25 min on Linux and 30 on Windows. A test that
    # hangs (a dialog nothing answers, a wait that never ends) used to sit
    # until GitHub's 6-hour limit, billed the whole time; #78's first run
    # did for 70 min before it was cancelled by hand.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Xvfb (Linux — virtual display for the Tk GUI tests)
        if: runner.os == 'Linux'
        run: |
          # The check that matters is that xvfb installs. `apt-get update` also
          # refreshes third-party repos the runner image ships (Google Chrome,
          # Microsoft); those intermittently serve an index with a hash-sum
          # mismatch, which fails the WHOLE update with exit 100 and reds a run
          # for a reason unrelated to this project. So the refresh is
          # best-effort with one retry — the install below still fails loudly
          # if the package genuinely cannot be fetched, and OPENFLO_REQUIRE_GUI
          # makes the GUI tests fail rather than skip if Xvfb is missing.
          sudo apt-get update || sudo apt-get update || true
          sudo apt-get install -y xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Use requirements.txt for the runtime surface so CI tracks
          # exactly what users get, then add dev tools on top.
          pip install -r requirements.txt
          # ruff runs in the lint job; pyright runs in the typecheck job
          # below, in its own environment.
          # pytest-timeout: a test still running after 15 min prints every
          # thread's stack and stops, so a hang names itself (see the
          # job's timeout-minutes).
          pip install pytest pytest-xdist pytest-timeout
          # Install the package itself (deps already pinned above) so the
          # test suite can `import openflo`.
          pip install -e . --no-deps

      # The GUI/continuity tests are Tk-guarded: they need a display or they
      # skip. Run them under a virtual framebuffer on Linux so they actually
      # execute in CI; Windows runners already have a desktop session.
      - name: Test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        env:
          MPLBACKEND: Agg
          # Xvfb is running, so Tk MUST work here. Every GUI test guards
          # itself with "skip if Tk is unavailable", which is fail-open: if Tk
          # stopped initialising, they would all skip and this leg would go
          # green having tested no GUI at all. Observed for real on
          # windows/py3.11 ("Can't find a usable init.tcl"), where a test
          # vanished from the run and nothing said so. This makes that an
          # error instead.
          OPENFLO_REQUIRE_GUI: '1'
        run: xvfb-run -a pytest -n auto -q --timeout=900 --timeout-method=thread --durations=15

      - name: Test (Windows)
        if: runner.os == 'Windows'
        env:
          MPLBACKEND: Agg
          OPENFLO_REQUIRE_GUI: '1'      # see the Linux step for why
          # A stuck dialog-sweep step writes its report here (a Windows
          # worker's stderr does not reach this log); printed below.
          OPENFLO_TEST_REPORTS: ${{ runner.temp }}/test-reports
        run: pytest -n auto -q --timeout=900 --timeout-method=thread --durations=15

      - name: Show stuck-test reports (Windows)
        if: failure() && runner.os == 'Windows'
        run: Get-ChildItem "${{ runner.temp }}/test-reports" -Filter *.txt -ErrorAction SilentlyContinue | Get-Content

      # The full-pipeline subprocess runs in tests/test_cli_e2e.py are opt-in
      # (OPENFLO_RUN_SLOW_TESTS=1), so the flagship headless path — openflo-run
      # over a folder of FCS, the thing the CLI exists for — had NO automated
      # integration coverage on any leg.
      #
      # Run them SERIALLY in their own step, not by setting the flag on the
      # step above: their docstring makes clear they were made opt-in because
      # they "balloon unpredictably under a loaded parent process", and the
      # main run uses `-n auto`, which is exactly that load. Serial and alone,
      # the flakiness reason does not apply. One leg only — ~70 s once rather
      # than four times, and a pipeline break will not be specific to an OS or
      # a minor Python version.
      # Also carries the clustering-determinism test: it clusters the same
      # data twice (~35s), and is the only check that would catch the default
      # reverting to PhenoGraph's unseeded Louvain binaries, which would make
      # every run give different labels without failing anything else.
      - name: Full-pipeline integration (Linux / py3.12 only, serial)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          MPLBACKEND: Agg
          OPENFLO_RUN_SLOW_TESTS: '1'
        run: xvfb-run -a pytest tests/test_cli_e2e.py tests/test_clustering_reproducible.py -q

  # ── macOS ─────────────────────────────────────────────────────────────────
  #
  # The README gives macOS setup steps, but no one in the project has a Mac,
  # and there is no legal macOS container for a non-Apple machine. GitHub's
  # macOS runners are the way to test it. On a private repository they bill
  # at ten times the Linux rate; on a public one they are free. So this job
  # runs ONLY on the public mirror (openflo-public, refreshed by
  # scripts/publish_public.py), where every refresh tests macOS at no cost,
  # and is skipped here. The runner has a desktop session, so the Tk tests
  # run for real, as on Windows.
  macos:
    name: macos-latest / py3.12
    if: github.repository == 'ChironTheCentaur/openflo-public'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist
          pip install -e . --no-deps

      - name: Test (macOS)
        env:
          MPLBACKEND: Agg
          OPENFLO_REQUIRE_GUI: '1'      # see the Linux step for why
          # A stuck dialog-sweep step writes its report here (a Windows
          # worker's stderr does not reach this log); printed below.
          OPENFLO_TEST_REPORTS: ${{ runner.temp }}/test-reports
        run: pytest -n auto -q --timeout=900 --timeout-method=thread --durations=15

      - name: Show stuck-test reports (Windows)
        if: failure() && runner.os == 'Windows'
        run: Get-ChildItem "${{ runner.temp }}/test-reports" -Filter *.txt -ErrorAction SilentlyContinue | Get-Content

      # The same serial pipeline and clustering-determinism run as the Linux
      # leg: seeded results must also repeat on a third OS.
      - name: Full-pipeline integration (serial)
        env:
          MPLBACKEND: Agg
          OPENFLO_RUN_SLOW_TESTS: '1'
        run: pytest tests/test_cli_e2e.py tests/test_clustering_reproducible.py -q

  # ── Type check ────────────────────────────────────────────────────────────
  #
  # Runs scripts/typecheck.py, the same script as the pre-push hook, with the
  # optional backends installed so pyright resolves every import. Defined
  # once in typecheck.yml so release.yml can require the same gate.
  typecheck:
    if: >-
      github.repository == 'ChironTheCentaur/openflo-public' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/'))
    uses: ./.github/workflows/typecheck.yml

  # The privacy gate from scripts/publish_public.py, run on every push to
  # every PR (drafts included) rather than only when the public mirror is
  # refreshed. Never gate this job on draft state. It scrubs the tree the
  # mirror would get AND the sdist/wheel PyPI would get, and fails on any
  # private token (sample names, local paths, personal email). The sdist once
  # shipped publish_public.py itself, token list and all.
  # Not on the public mirror: publish_public.py holds the private token list,
  # so it is left out of the mirror (export-ignore), and the gate already ran
  # here before the snapshot was pushed.
  privacy:
    name: privacy gate
    if: github.repository != 'ChironTheCentaur/openflo-public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scrub the public-mirror export
        run: python scripts/publish_public.py --check

      - name: Scrub the sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist
          python scripts/publish_public.py --check-dist dist

  # ── Installability ────────────────────────────────────────────────────────
  #
  # The `test` job above installs `requirements.txt` (exact pins) and then the
  # package with `-e . --no-deps`. That is the right thing for testing the
  # code, but it means two claims this project makes go completely unverified:
  #
  #   1. That the BUILT ARTIFACT works. An editable install imports straight
  #      out of `src/`, so a file missing from `[tool.setuptools.package-data]`
  #      — `_golden.json`, `py.typed`, the template library — is invisible in
  #      CI and breaks only for someone who ran `pip install openflo`.
  #
  #   2. That the declared RANGES are true. `numpy>=2.0,<3` promises a span of
  #      versions; pip resolves the newest, and requirements.txt pins one exact
  #      point. Nothing ever installs the floor, so every lower bound in
  #      pyproject.toml is an assertion no test can falsify — the same
  #      "check that cannot fail" shape this codebase keeps finding, in
  #      packaging form.
  #
  # So: build the wheel, install it into a clean environment at BOTH edges of
  # the declared ranges, and make the installed artifact prove itself by
  # reproducing the golden baseline and passing the response controls.
  #
  # This job earned its place immediately: it found that matplotlib 3.8.0-3.8.3
  # declare `numpy<2`, making the floor combination a ResolutionImpossible even
  # though the two versions run together fine. Bisection had used --no-deps,
  # which skips the declared bound and hid it.
  install:
    name: install ${{ matrix.resolution }} deps / ${{ matrix.os }}
    if: >-
      github.repository == 'ChironTheCentaur/openflo-public' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/'))
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash          # one code path for the wheel glob on both OSes
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor: the oldest dependency set we claim to support, on the
          # oldest Python we claim to support (`requires-python = >=3.11`).
          # These move together on purpose — the floors were picked as "the
          # first release built for numpy 2", and numpy 2.0 ships no wheels
          # for 3.13, so the old stack can only be exercised on an old Python.
          - os: ubuntu-latest
            python: "3.11"
            resolution: lowest
          - os: windows-latest
            python: "3.11"
            resolution: lowest
          # The ceiling: whatever pip resolves today, which is what a user
          # actually gets from `pip install openflo`.
          - os: ubuntu-latest
            python: "3.12"
            resolution: highest
          - os: windows-latest
            python: "3.12"
            resolution: highest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      # Generated from pyproject.toml rather than hand-maintained: widening a
      # floor changes what this job installs, with no second place to update.
      - name: Pin every dependency to its declared floor
        if: matrix.resolution == 'lowest'
        run: |
          python scripts/lowest_direct_requirements.py > lowest.txt
          cat lowest.txt

      # A CI runner has a C compiler, so `pip install` at the floor succeeds by
      # BUILDING any dependency that ships no wheel — and the leg goes green
      # while an ordinary user, a slim container or a minimal image fails at
      # exactly that point. That is not hypothetical: the psutil floor was
      # 5.9, and psutil 5.9.0-5.9.3 publish Linux wheels only up to cp310, so
      # Python 3.11 had to compile it. ubuntu-latest did so without comment;
      # python:3.11-slim could not. Assert the property the user cares about
      # instead of relying on the runner to lack a toolchain.
      - name: Every floor pin must ship a wheel for this platform
        if: matrix.resolution == 'lowest'
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          # FlowIO publishes an sdist only, but it is pure Python: pip builds
          # it with setuptools alone, no compiler needed. Every other floor pin
          # carries C extensions, so a missing wheel there means the user needs
          # a toolchain we never told them about.
          PURE_PYTHON_SDIST_ONLY = {'FlowIO'}

          missing = []
          for line in pathlib.Path('lowest.txt').read_text().splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              if line.split('==')[0] in PURE_PYTHON_SDIST_ONLY:
                  continue
              probe = subprocess.run(
                  [sys.executable, '-m', 'pip', 'download', '--no-deps',
                   '--only-binary=:all:', '--dest', 'wheelprobe', line],
                  capture_output=True, text=True)
              status = 'wheel' if probe.returncode == 0 else 'NO WHEEL'
              print(f'  {status:8}  {line}')
              if probe.returncode != 0:
                  missing.append(line)

          if missing:
              raise SystemExit(
                  'These floor pins have no wheel here, so installing them '
                  'requires a C compiler: ' + ', '.join(missing) + '. Raise '
                  'the floor to the first release that ships one.')
          print('every floor pin ships a wheel for this platform')
          PY

      # No `-e`, no `--no-deps`: resolve for real, from the artifact, the way a
      # user does. `pytest` comes along so the response controls can run.
      - name: Install the wheel (floor)
        if: matrix.resolution == 'lowest'
        run: pip install dist/*.whl pytest -c lowest.txt

      - name: Install the wheel (newest resolvable)
        if: matrix.resolution == 'highest'
        run: pip install dist/*.whl pytest

      # A src-layout checkout puts nothing importable in the working directory,
      # so `import openflo` MUST land in site-packages. If it ever resolves to
      # the checkout instead, every check below silently reverts to testing the
      # source tree — exactly the blind spot this job exists to close.
      - name: Prove we are testing the installed package, not the checkout
        run: |
          python - <<'PY'
          import pathlib
          import openflo
          from openflo import selftest          # noqa: F401  (import must work)
          path = pathlib.Path(openflo.__file__).resolve()
          assert 'site-packages' in path.parts, f'imported from {path}'
          print('openflo imported from', path)
          PY

      # Package data is the failure an editable install cannot see.
      - name: Check the shipped data files
        run: |
          python - <<'PY'
          from importlib.resources import files
          root = files('openflo')
          for name in ('_golden.json', 'py.typed'):
              assert root.joinpath(name).is_file(), f'{name} missing from the wheel'
          templates = [p.name for p in root.joinpath('template_library').iterdir()]
          assert any(n.endswith('.json') for n in templates), \
              f'template library shipped empty: {templates}'
          print(f'package data ok ({len(templates)} template files)')
          PY

      - name: Check for conflicting requirements
        run: pip check

      # Exits 1 when unhealthy. Runs the seeded behavioural self-test, so this
      # asserts the INSTALLED artifact still reproduces the golden baseline on
      # this dependency set — a numeric change from a dependency shows up here.
      - name: Doctor (golden baseline, from the install)
        env:
          MPLBACKEND: Agg
        run: openflo-doctor

      # The controls are relational, so unlike the golden they should hold at
      # every point in the range. A failure here means a dependency changed a
      # RESPONSE, not just a digit.
      - name: Response controls
        env:
          MPLBACKEND: Agg
        run: pytest tests/test_selftest_controls.py -q

      # The console scripts are declared in pyproject.toml; nothing else checks
      # that they were actually generated and are runnable.
      - name: Check the console scripts exist
        run: |
          openflo-run --help > /dev/null
          openflo-selftest > /dev/null
          echo "console scripts ok"
