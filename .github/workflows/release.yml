name: Release to PyPI

# Builds the sdist + wheel on every version tag (always — validates the
# package), and publishes to PyPI only once publishing is turned on.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no token stored. Until it's
# configured the publish step would fail with `invalid-publisher`, so it is
# gated behind a repository variable: the build still runs and validates, but
# publish is skipped (the run stays green). To enable:
#   1. Create the `openflo` project on PyPI and add a Trusted Publisher for
#      this repo + the `release.yml` workflow (Publishing settings).
#   2. Set repository variable PYPI_PUBLISH = true (Settings → Secrets and
#      variables → Actions → Variables).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag can point at a commit CI never ran on (pushed straight to a tag,
  # CI was red, or the Actions budget was out). Nothing is built, so nothing
  # can be published, until the full CI has passed on the tagged tree: the
  # test matrix with the GUI, the type check and the install checks. Exactly
  # one of the two jobs below runs.
  #
  # On the public mirror: the whole of ci.yml, on free runners.
  ci:
    if: github.repository == 'ChironTheCentaur/openflo-public'
    uses: ./.github/workflows/ci.yml

  # On the private repository: no matrix (metered minutes). The PR's last
  # mirror run (a ci/** branch push of its scrubbed export) already tested
  # this exact tree, since merging an up-to-date branch gives master the same
  # tree, so the release asks the mirror for that result instead of paying
  # for the matrix again. --ci-status exits 0 only when a mirror ci.yml push
  # run on a commit with the same export tree succeeded; 1 when it failed,
  # 2 when there is none yet or it is still running. Either way the job
  # fails and nothing is built.
  mirror-ci:
    name: Mirror CI passed on this tree
    if: github.repository != 'ChironTheCentaur/openflo-public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scrub the public-mirror export
        run: python scripts/publish_public.py --check
      - name: Find a green mirror run for the same tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_public.py --ci-status

  build:
    name: Build distributions
    needs: [ci, mirror-ci]
    # One of the two gates is always skipped, and a skipped need would skip
    # this job by default; so run unless a gate failed or was cancelled, and
    # only when one of them actually passed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.ci.result == 'success' || needs.mirror-ci.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # The mirror has no publish_public.py (it holds the private token list);
      # PyPI is published from the private repo, where this runs.
      - name: Privacy gate (no private tokens in what PyPI gets)
        if: github.repository != 'ChironTheCentaur/openflo-public'
        run: python scripts/publish_public.py --check-dist dist
      - name: Check metadata
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Opt-in: skipped (not failed) until PyPI Trusted Publishing is set up and
    # the PYPI_PUBLISH repo variable is "true". Keeps tag pushes green.
    # needs.build.result is checked explicitly: the implicit success() also
    # looks at build's own needs, one of which is always skipped.
    if: ${{ !cancelled() && needs.build.result == 'success' && vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write            # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
