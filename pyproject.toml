[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openflo"
version = "2.4.3"
description = "Flow cytometry analysis pipeline + Tk GUI with FlowJo .wsp round-trip"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Skyler Niedzielski" }]
keywords = ["flow-cytometry", "fcs", "phenograph", "umap", "flowjo", "gating"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "FlowIO==1.4.0",
    "FlowUtils==1.2.2",
    # The range is not ours to choose: FlowUtils declares numpy>=2.0,<3.0,
    # and that is also the boundary every other compiled dependency here
    # bottoms out at (matplotlib 3.6, scikit-learn 1.3, scipy 1.11 and
    # pandas 2.1 all fail to import against numpy 2 because they predate
    # it). So the major is fixed, and each of those floors is really
    # "the first release built for numpy 2".
    #
    # The golden baseline warns that its 1e-9 tolerances depend on this
    # pin. Tested rather than believed: at 2.0.2 the golden is 8/8 with
    # those tolerances intact, because numpy guarantees the Generator
    # stream across versions and the ops are IEEE-deterministic float64.
    # That guarantee is within a major — re-check if numpy 3 ever lands.
    "numpy>=2.0,<3",
    # Spans the 2/3 major boundary DELIBERATELY, on evidence: the full
    # suite, golden 8/8 and controls 22/22 all pass on 2.2.2 and on
    # 3.0.3, `compare_conditions` returns identical numbers on both, and
    # no pandas warning is raised. The 2-vs-3 risk is copy-on-write, so
    # that was probed directly: with CoW OFF (the 2.x default) our
    # aliasing behaves the same — nothing here depends on it either way.
    #
    # It also fixes a real breakage rather than merely allowing one:
    # anndata requires pandas<3, so pinning to 3.0.3 shipped an
    # `interop` extra that could not be installed alongside its own
    # dependency.
    #
    # Floor is the numpy-2 ABI again: 2.1.4 fails with "numpy.dtype size
    # changed"; 2.2.2 is the first that imports.
    "pandas>=2.2.2",
    # Our own use is all long-stable API (ndimage, signal.find_peaks,
    # stats, csgraph, PchipInterpolator) and would allow far older. Three
    # things push the floor up, and the last one is easy to miss:
    #   1.11.4 will not import at all — numpy-2 ABI, as with matplotlib
    #          and scikit-learn.
    #   1.13/1.14 import and pass the whole suite, but WARN that numpy
    #          2.4.6 is outside their supported range (<2.3.0). Passing
    #          tests are not the same as a supported combination, and
    #          shipping that pairing would declare something SciPy
    #          disowns.
    #   1.15.0 is the first that supports the numpy we require.
    # If the numpy floor is ever lowered, revisit: this bound exists to
    # match numpy, not because of anything scipy removed.
    "scipy>=1.15",
    # Floor is set by umap-learn, not by our own API use. Our calls
    # (KMeans(n_init="auto"), MDS(normalized_stress="auto")) work from
    # 1.4, but umap-learn 0.5.12 requires >=1.6 and calls
    # check_array(ensure_all_finite=...), which does not exist before it.
    # At 1.4.2 UMAP failed SILENTLY — the embedding columns were simply
    # absent from the events export, and only a test caught it.
    # (1.3.2 does not even import: numpy-2 ABI, as with matplotlib.)
    "scikit-learn>=1.6",
    # Never imported directly — it is the engine pandas uses for
    # read_excel/to_excel, so pandas mediates the whole API and the floor is
    # PANDAS' minimum, not ours. Measured: with openpyxl 3.1.0 installed,
    # pandas raises "Pandas requires version '3.1.5' or newer of 'openpyxl'"
    # on the first read_excel — so a `>=3.1` range would have been a false
    # claim that only failed at runtime. Re-check this floor when the pandas
    # range moves.
    "openpyxl>=3.1.5",
    "PhenoGraph==1.5.7",
    "umap-learn==0.5.12",
    "igraph==1.0.0",
    "leidenalg==0.11.0",
    # Floor found by BISECTION, not judgement: 3.8.0 runs the full suite
    # clean, 3.6.0 SEGFAULTS. The cause is a cross-dependency boundary —
    # matplotlib 3.6 predates numpy 2.0 and its compiled extensions hit a
    # numpy-2 ABI mismatch. The same coupling applies to the other
    # compiled deps (scipy, scikit-learn), so these floors are really
    # "the first release built for numpy 2" and move together with it.
    #
    # 3.8.4, not 3.8: 3.8.0-3.8.3 DECLARE `numpy<2`, so `matplotlib==3.8.0`
    # with `numpy>=2.0` is a ResolutionImpossible even though the two run
    # together fine (bisection used --no-deps, which skips the declared
    # bound and hid this). 3.8.4 dropped the cap. Found by the floor-install
    # job in CI, which is exactly what it is for.
    "matplotlib>=3.8.4",
    # One lazy-imported call: sns.heatmap(cmap=, center=, ax=) for the
    # marker-median heatmap. Those parameters have been stable since 0.7.
    "seaborn>=0.12",
    # Only `psutil.virtual_memory()` is used (RAM-based load-pool sizing and
    # the CLI admission gate), and every call site already degrades
    # gracefully when psutil is absent. That API has been stable for the
    # life of the project, so this is left unbounded above: an upper cap is
    # what creates coexistence conflicts, which is the thing being fixed.
    # Floor tested at 5.9.0, not assumed -- but 5.9.0 was tested on WINDOWS,
    # where a cp310 wheel is not needed because psutil ships per-version
    # Windows wheels. On Linux, 5.9.0-5.9.3 publish wheels only up to cp310,
    # so Python 3.11+ has to BUILD psutil from source, which needs a C
    # compiler and headers. An ubuntu-latest CI runner has both and installs
    # it happily; a slim container, a minimal image or an ordinary user does
    # not. 5.9.4 switched to a cp36-abi3 wheel, which covers every Python we
    # support. Found by running the floor install in python:3.11-slim.
    "psutil>=5.9.4",
]

[project.optional-dependencies]
gui = ["tkinterdnd2==0.4.3"]
# Extra dimensionality-reduction backends (UMAP + t-SNE ship in core deps;
# t-SNE via scikit-learn).
embed = ["trimap>=1.1.4", "pacmap>=0.7.3", "phate>=1.0.11"]
# Single-cell ecosystem interop (AnnData / .h5ad export for scanpy).
interop = ["anndata>=0.10"]
# Optional NVIDIA-GPU acceleration of the load math (compensation + arcsinh),
# opt-in via Preferences. Native-Windows-capable (unlike RAPIDS/cuML). The
# nvidia-* wheels supply the CUDA libs CuPy 14 locates at runtime (cuBLAS for
# the matmul, nvrtc/nvjitlink for elementwise kernels); ~650 MB total.
gpu = [
    "cupy-cuda12x>=13",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-nvjitlink-cu12",
]
# Vendor-portable GPU acceleration of the load math via the PyTorch backend
# (gpu_accel 'torch'). Covers NVIDIA + AMD (ROCm build) + Intel (XPU) + Apple
# (MPS). Same opt-in flag; falls back to numpy on any error. Install the torch
# build matching your platform (CUDA / ROCm / XPU) from pytorch.org if the
# default wheel here isn't right for your GPU.
gpu-torch = ["torch>=2.4"]
# AMD/Intel/NVIDIA on *native Windows* via DirectML (any Direct3D-12 GPU) — the
# only path that reaches AMD/Intel GPUs without WSL2/Linux. Windows-only wheel;
# torch-directml pins its own compatible torch.
gpu-dml = ["torch-directml>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",  # parallel test runs: `pytest -n auto` (~2x on the suite)
    "pyright==1.1.410",   # pinned: keep local type-checking identical to CI
    "ruff==0.15.19",      # pinned to match CI (an unpinned bump broke Lint once)
    "vulture>=2.16",
]

[project.urls]
# Point at the PUBLIC mirror — this metadata ships on PyPI, so it must not
# reference the private development repo.
Homepage  = "https://github.com/ChironTheCentaur/openflo-public"
Source    = "https://github.com/ChironTheCentaur/openflo-public"
Issues    = "https://github.com/ChironTheCentaur/openflo-public/issues"
Changelog = "https://github.com/ChironTheCentaur/openflo-public/blob/main/CHANGELOG.md"

[project.scripts]
openflo-run      = "openflo.cli:main"
openflo-compare  = "openflo.compare:main"
openflo-voltage  = "openflo.voltage:main"
openflo-synth    = "openflo.synthetic:main"
openflo-selftest = "openflo.selftest:main"
openflo-doctor   = "openflo.diagnostics:main"

[project.gui-scripts]
openflo-gui = "openflo.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openflo = ["py.typed", "_golden.json", "template_library/*.json", "template_library/*.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "outputs", "results", "test fsc", ".phenograph_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter; many long scientific lines are clearer left as-is
    "E701",  # compact `if x: return` guard lines used throughout
    "E702",  # `import a, b, c` style on a single line — legacy code uses it
]

[tool.vulture]
# Run with: vulture src/ tests/
# Most flagged items below 80% confidence are false-positives:
#   - __getattr__ — PEP-562 lazy import hooks (dynamic dispatch)
#   - print_matrices / add_fmos_from_dir / exclude_pattern /
#     keep_pattern / run_all / plot_all / concatenate_group /
#     export_all — public API on WspReader / FlowExperiment used by
#     library consumers, not by our internal code paths
#   - _JOBOBJECT_EXTENDED_LIMIT_INFORMATION / LimitFlags — ctypes
#     Structure field declarations accessed by name reflection
#   - umap_coords — populated optionally; consumers check then read
# Stick to min-confidence 80 to keep these out of CI noise.
min_confidence = 80
paths = ["src", "tests"]
exclude = ["scripts/smoke_test.py"]
ignore_decorators = ["@pytest.fixture", "@pytest.mark.parametrize", "@staticmethod", "@classmethod"]

[tool.pyright]
# Type-check the shipped library only; tests use loose stubs/mocks by design.
include       = ["src"]
exclude       = [".venv", "outputs", "results", "test fsc", ".phenograph_cache", "__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports        = "warning"
reportMissingTypeStubs      = "none"
